<style>
        /* Immersive background gradient */
        .immersive-bg {
            background: linear-gradient(180deg, theme('colors.sage-top') 0%, theme('colors.emerald-lush') 150%);
        }
        
        /* Glassmorphism card */
        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid theme('colors.glass-border');
            box-shadow: 0 20px 40px -10px rgba(5, 150, 105, 0.15);
        }

        /* Glass input focus */
        .glass-input:focus {
            border-color: theme('colors.emerald-lush');
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05), 0 0 0 4px rgba(16, 185, 129, 0.1);
            outline: none;
        }

<body class="immersive-bg min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface antialiased">
<!-- Main Container -->
<div class="w-full max-w-md">
<!-- Glass Card -->
<div class="glass-card rounded-xl p-8 md:p-10 flex flex-col items-center">
<!-- Logo & Brand -->
<div class="flex items-center gap-3 mb-6">
<span class="material-symbols-outlined text-4xl text-emerald-deep" data-icon="local_pharmacy">local_pharmacy</span>
<h1 class="font-display-lg text-headline-lg-mobile md:text-headline-lg text-emerald-deep tracking-tighter">RapidMedico</h1>
</div>
<!-- Titles -->
<div class="text-center mb-10 w-full">
<h2 class="font-title-lg text-title-lg text-on-surface mb-2">Partner Portal</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Login to manage your store</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Phone Number Input Group -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="phone">Phone Number</label>
<div class="relative flex items-center">
<span class="absolute left-4 font-body-md text-body-md text-on-surface-variant select-none">+1</span>
<input class="glass-input w-full pl-12 pr-4 py-3 rounded-lg bg-white/50 border border-outline-variant font-body-md text-body-md text-on-surface transition-all duration-200 placeholder:text-outline" id="phone" name="phone" placeholder="(555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-gradient-to-br from-emerald-lush to-emerald-deep text-on-primary font-title-lg text-title-lg py-4 rounded-lg shadow-[0_8px_20px_-6px_rgba(5,150,105,0.4)] hover:shadow-[0_12px_24px_-6px_rgba(5,150,105,0.5)] active:scale-[0.98] transition-all duration-200 mt-2 flex items-center justify-center gap-2 group" type="submit">
<span>SEND OTP</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform duration-200" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-8">
<div class="h-px bg-glass-border flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">or</span>
<div class="h-px bg-glass-border flex-1"></div>
</div>
<!-- Registration Link -->
<a class="font-body-md text-body-md text-emerald-deep hover:text-emerald-lush transition-colors duration-200 flex items-center gap-1" href="#">
                New pharmacy? <span class="font-bold underline decoration-2 underline-offset-4">Register your store</span>
</a>
</div>
